spring:
  threads:
    virtual:
      enabled: true
  application:
    name: ircs-portal-bff
  servlet:
    multipart:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  bff:
    audit:
      enabled: ${APP_BFF_AUDIT_ENABLED:true}
    proxy:
      connect-timeout: ${APP_BFF_PROXY_CONNECT_TIMEOUT:PT5S}
      request-timeout: ${APP_BFF_PROXY_REQUEST_TIMEOUT:PT5S}
      circuit-key: ${APP_BFF_PROXY_CIRCUIT_KEY:portal-bff-proxy}
      circuit:
        enabled: ${APP_BFF_PROXY_CIRCUIT_ENABLED:${IRCS_OUTBOUND_CIRCUIT_PORTAL_BFF_PROXY_ENABLED:${IRCS_OUTBOUND_CIRCUIT_ENABLED:true}}}
        failure-threshold: ${APP_BFF_PROXY_CIRCUIT_FAILURE_THRESHOLD:${IRCS_OUTBOUND_CIRCUIT_PORTAL_BFF_PROXY_FAILURE_THRESHOLD:${IRCS_OUTBOUND_CIRCUIT_FAILURE_THRESHOLD:5}}}
        open-duration: ${APP_BFF_PROXY_CIRCUIT_OPEN_DURATION:${IRCS_OUTBOUND_CIRCUIT_PORTAL_BFF_PROXY_OPEN_DURATION:${IRCS_OUTBOUND_CIRCUIT_PORTAL_BFF_PROXY_OPEN_DURATION_MS:${IRCS_OUTBOUND_CIRCUIT_OPEN_DURATION:${IRCS_OUTBOUND_CIRCUIT_OPEN_DURATION_MS:PT30S}}}}}
        half-open-max-calls: ${APP_BFF_PROXY_CIRCUIT_HALF_OPEN_MAX_CALLS:${IRCS_OUTBOUND_CIRCUIT_PORTAL_BFF_PROXY_HALF_OPEN_MAX_CALLS:${IRCS_OUTBOUND_CIRCUIT_HALF_OPEN_MAX_CALLS:1}}}
    targets:
      identity: ${APP_BFF_IDENTITY_BASE_URL:http://ircs-identity-service.ircs-dev.svc.cluster.local:8080}
      interaction: ${APP_BFF_INTERACTION_BASE_URL:http://ircs-interaction-service.ircs-dev.svc.cluster.local:8080}
      portal: ${APP_BFF_PORTAL_BASE_URL:http://ircs-portal-service.ircs-dev.svc.cluster.local:8080}
      search: ${APP_BFF_SEARCH_BASE_URL:http://ircs-search-service.ircs-dev.svc.cluster.local:8080}
      storage: ${APP_BFF_STORAGE_BASE_URL:http://ircs-storage-service.ircs-dev.svc.cluster.local:8080}

ircs:
  outbound:
    circuit:
      portal-bff-proxy:
        enabled: ${IRCS_OUTBOUND_CIRCUIT_PORTAL_BFF_PROXY_ENABLED:${IRCS_OUTBOUND_CIRCUIT_ENABLED:true}}
        failure-threshold: ${IRCS_OUTBOUND_CIRCUIT_PORTAL_BFF_PROXY_FAILURE_THRESHOLD:${IRCS_OUTBOUND_CIRCUIT_FAILURE_THRESHOLD:5}}
        open-duration: ${IRCS_OUTBOUND_CIRCUIT_PORTAL_BFF_PROXY_OPEN_DURATION:${IRCS_OUTBOUND_CIRCUIT_OPEN_DURATION:PT30S}}
        open-duration-ms: ${IRCS_OUTBOUND_CIRCUIT_PORTAL_BFF_PROXY_OPEN_DURATION_MS:${IRCS_OUTBOUND_CIRCUIT_OPEN_DURATION_MS:30000}}
        half-open-max-calls: ${IRCS_OUTBOUND_CIRCUIT_PORTAL_BFF_PROXY_HALF_OPEN_MAX_CALLS:${IRCS_OUTBOUND_CIRCUIT_HALF_OPEN_MAX_CALLS:1}}
