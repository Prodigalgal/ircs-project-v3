name: Docker Hub V3 Images

on:
  workflow_dispatch:
    inputs:
      build_scope:
        description: "all or comma-separated service image names"
        required: false
        default: "all"

permissions:
  contents: read

concurrency:
  group: dockerhub-v3-images
  cancel-in-progress: false

jobs:
  backend-images:
    runs-on: ubuntu-22.04
    env:
      REGISTRY: docker.io/speedproxy
      TARGET_PLATFORMS: linux/arm64,linux/amd64
      IMAGE_TAG: v3-latest
      JIB_BASE_IMAGE: public.ecr.aws/docker/library/eclipse-temurin:25-jre-alpine
      REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
      BUILD_SCOPE_INPUT: ${{ inputs.build_scope }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          name: ircs-builder
          driver-opts: image=moby/buildkit:latest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push V3 images
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          chmod +x scripts/ci/jib-build-push-affected.sh
          export BUILD_SCOPE="${BUILD_SCOPE_INPUT:-all}"
          scripts/ci/jib-build-push-affected.sh
          {
            echo "source_sha=$(git rev-parse HEAD)"
            echo "image_tag=${IMAGE_TAG}"
          } >> build-image-manifest.txt

      - name: Print image manifest
        shell: bash
        run: cat build-image-manifest.txt

      - name: Upload image manifest
        uses: actions/upload-artifact@v4
        with:
          name: v3-backend-image-manifest
          path: build-image-manifest.txt
