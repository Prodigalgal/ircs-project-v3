name: V3 Publish Verified Artifacts

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed full Native run with successful build, runtime and manifest gates
        required: true
      source_revision:
        description: Exact 40-character source SHA reserved by the candidate version
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: v3-production-promotion
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: candidate
        name: Verify existing candidate and prevent stale application promotion
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          CANDIDATE_SHA: ${{ inputs.source_revision }}
        run: python3 .github/scripts/promote-verified.py --run-id "$RUN_ID" --source-revision "$CANDIDATE_SHA"
      - name: Publish verified references to production GitOps
        env:
          GH_TOKEN: ${{ github.token }}
          GITOPS_DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
          SOURCE_REVISION: ${{ steps.candidate.outputs.source_revision }}
          RELEASE_TAG: ${{ steps.candidate.outputs.release_tag }}
          APP_VERSION: ${{ steps.candidate.outputs.version }}
          JAVA_IMAGES: ${{ steps.candidate.outputs.java_images }}
          SELECTED_IMAGES: ${{ steps.candidate.outputs.selected_images }}
          VERIFIED_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/ircs-v3-publish-key"
          hosts_file="${RUNNER_TEMP}/ircs-v3-publish-hosts"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          test -n "$GITOPS_DEPLOY_KEY"
          printf '%s\n' "$GITOPS_DEPLOY_KEY" > "$key_file"
          chmod 600 "$key_file"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$hosts_file"
          export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$hosts_file"
          git clone --depth 1 git@github.com:Prodigalgal/k8s-gitops-config.git gitops
          python3 .github/scripts/update-gitops.py gitops
          kubectl kustomize gitops/ircs-prod/core > /dev/null
          kubectl kustomize gitops/ircs-prod/edge-cutover > /dev/null
          git -C gitops add ircs-prod/core
          if git -C gitops diff --cached --quiet; then
            echo 'GitOps already references the verified artifacts.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -C gitops -c user.name=ircs-v3-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m "deploy(ircs-v3): ${APP_VERSION} verified ${SOURCE_REVISION}"
          for attempt in 1 2 3 4; do
            if git -C gitops push origin HEAD:main; then
              echo "Published verified V3 ${APP_VERSION} artifacts without rebuilding." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git -C gitops fetch origin main
            git -C gitops rebase origin/main
          done
          exit 1
