name: V3 Native Build

on:
  push:
    branches: [main, 'upgrade/**']
  workflow_dispatch:
    inputs:
      build_scope:
        description: auto, all, or comma-separated images to add to pending changes
        default: auto
        required: false

permissions:
  contents: read

concurrency:
  group: v3-native-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      images: ${{ steps.matrix.outputs.images }}
      registry: ${{ steps.matrix.outputs.registry }}
      selected_images: ${{ steps.matrix.outputs.selected_images }}
      has_selected: ${{ steps.matrix.outputs.has_selected }}
      java_tests: ${{ steps.matrix.outputs.java_tests }}
      java_test_modules: ${{ steps.matrix.outputs.java_test_modules }}
      python_changed: ${{ steps.matrix.outputs.python_changed }}
      python_tests: ${{ steps.matrix.outputs.python_tests }}
      frontends: ${{ steps.matrix.outputs.frontends }}
      frontend_tests: ${{ steps.matrix.outputs.frontend_tests }}
      frontend_matrix: ${{ steps.matrix.outputs.frontend_matrix }}
      frontend_test_matrix: ${{ steps.matrix.outputs.frontend_test_matrix }}
      image_refs: ${{ steps.matrix.outputs.image_refs }}
      module_versions: ${{ steps.matrix.outputs.module_versions }}
      version: ${{ steps.release.outputs.version }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify release metadata
        run: python3 .github/scripts/check-version.py
      - name: CI planner and publishing-script regression
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
          python3 -m unittest discover -s backend/scripts/ci -p 'test_*.py' -v
      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes=
      - id: fast
        name: Plan this event without accessing private credentials
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_SCOPE: ${{ inputs.build_scope || 'auto' }}
        run: |
          set -euo pipefail
          base_args=()
          if [[ -n "$EVENT_BEFORE" && ! "$EVENT_BEFORE" =~ ^0+$ ]]; then
            base_args=(--base "$EVENT_BEFORE")
          fi
          python3 .github/scripts/affected-plan.py "${base_args[@]}" --head "$GITHUB_SHA" --output "$RUNNER_TEMP/fast-plan.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads((Path(os.environ['RUNNER_TEMP']) / 'fast-plan.json').read_text())
          requires_baseline = bool(plan['requires_promoted_baseline'])
          requires_baseline = requires_baseline or os.environ['EVENT_NAME'] == 'workflow_dispatch'
          requires_baseline = requires_baseline or os.environ['FORCE_SCOPE'] not in ('', 'auto')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('requires_baseline=' + str(requires_baseline).lower() + '\n')
          PY
          cp "$RUNNER_TEMP/fast-plan.json" "$RUNNER_TEMP/affected-plan.json"
      - name: Read last promoted component ledger and include unpromoted changes
        if: steps.fast.outputs.requires_baseline == 'true'
        env:
          GITOPS_DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          key_file="$(mktemp "$RUNNER_TEMP/ircs-plan-key.XXXXXX")"
          hosts_file="$(mktemp "$RUNNER_TEMP/ircs-plan-hosts.XXXXXX")"
          clone_dir="$(mktemp -d "$RUNNER_TEMP/ircs-plan-gitops.XXXXXX")"
          trap 'rm -f "$key_file" "$hosts_file"; rm -rf "$clone_dir"' EXIT
          test -n "$GITOPS_DEPLOY_KEY"
          printf '%s\n' "$GITOPS_DEPLOY_KEY" > "$key_file"
          chmod 600 "$key_file"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$hosts_file"
          export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$hosts_file"
          git clone --depth 1 git@github.com:Prodigalgal/k8s-gitops-config.git "$clone_dir"
          if [[ -f "$clone_dir/ircs-prod/core/release-state.json" ]]; then
            cp "$clone_dir/ircs-prod/core/release-state.json" "$RUNNER_TEMP/release-state.json"
            baseline="$(python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          value = json.loads((Path(os.environ['RUNNER_TEMP']) / 'release-state.json').read_text())
          revision = value.get('source_revision', '')
          assert value.get('schema_version') == 1 and re.fullmatch('[0-9a-f]{40}', revision), 'Invalid release-state baseline'
          print(revision)
          PY
            )"
            git merge-base --is-ancestor "$baseline" "$GITHUB_SHA"
            python3 .github/scripts/affected-plan.py --base "$baseline" --head "$GITHUB_SHA" --output "$RUNNER_TEMP/affected-plan.json"
          else
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads((Path(os.environ['RUNNER_TEMP']) / 'fast-plan.json').read_text())
          assert plan['initial'], 'Seed release-state.json before an incremental application release'
          PY
          fi
      - id: matrix
        name: Select only affected build and test matrices
        env:
          BUILD_SCOPE: ${{ inputs.build_scope || 'auto' }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads((Path(os.environ['RUNNER_TEMP']) / 'affected-plan.json').read_text())
          assert not plan['removed_java_images'], 'Removed applications need an explicit GitOps deletion review'
          PY
          python3 backend/scripts/ci/native-matrix.py --plan "$RUNNER_TEMP/affected-plan.json" --baseline "$RUNNER_TEMP/release-state.json"
      - id: release
        if: steps.matrix.outputs.has_selected == 'true'
        name: Verify reserved immutable application candidate
        run: python3 .github/scripts/release-info.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: affected-plan
          path: ${{ runner.temp }}/affected-plan.json
          retention-days: 14

  java-tests:
    needs: prepare
    if: needs.prepare.outputs.java_tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ircs
          POSTGRES_PASSWORD: ci-disposable-password
          POSTGRES_DB: ircs_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ircs -d ircs_test" --health-interval 5s --health-timeout 3s --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports: ['6379:6379']
        options: --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      IRCS_TEST_KEY_VALUE_PORT: '6379'
      IRCS_TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/ircs_test
      IRCS_TEST_POSTGRES_USER: ircs
      IRCS_TEST_POSTGRES_PASSWORD: ci-disposable-password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          check-latest: true
          cache: gradle
      - name: Affected Java regression suite
        env:
          JAVA_TEST_MODULES: ${{ needs.prepare.outputs.java_test_modules }}
        run: |
          chmod +x gradlew
          mapfile -t tasks < <(python3 -c 'import json, os; print("\n".join(":" + module + ":test" for module in json.loads(os.environ["JAVA_TEST_MODULES"])))')
          test "${#tasks[@]}" -gt 0
          ./gradlew --no-daemon --console=plain --continue "${tasks[@]}"
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-test-results
          path: 'backend/**/build/test-results/test/*.xml'
          retention-days: 7

  python-tests:
    needs: prepare
    if: needs.prepare.outputs.python_tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/services/ircs-adult-classifier-service/requirements*.txt
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
          python -m pip install -r backend/services/ircs-adult-classifier-service/requirements-test.txt
          python -m pip check
      - name: Offline model and HTTP regression suite
        working-directory: backend/services/ircs-adult-classifier-service
        run: python -m unittest discover -s tests -v

  native-images:
    name: Native ${{ matrix.image }} / ${{ matrix.arch }}
    needs: [prepare, java-tests]
    if: needs.prepare.outputs.images != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      IMAGE: ${{ needs.prepare.outputs.registry }}/${{ matrix.image }}:${{ needs.prepare.outputs.release_tag }}-${{ matrix.arch }}
      APP_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: published
        name: Check immutable candidate image
        run: |
          if bash .github/scripts/image-exists.sh "$IMAGE"; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            result=$?
            test "$result" = 1
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build Native image on matching architecture
        if: steps.published.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/scripts/docker/Dockerfile.native
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE }}
          provenance: false
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
            GRADLE_PROJECT=${{ matrix.module }}
            MODULE_DIR=${{ matrix.directory }}
            IMAGE_NAME=${{ matrix.image }}
            NATIVE_TARGET_MACHINE=${{ matrix.machine }}
            NATIVE_BUILD_MEMORY=${{ matrix.image == 'ircs-search-service' && '10g' || '8g' }}
            NATIVE_BUILD_PARALLELISM=${{ matrix.image == 'ircs-search-service' && '2' || '4' }}
          cache-from: type=gha,scope=native-${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=native-${{ matrix.image }}-${{ matrix.arch }}
      - name: Native HTTP and migration smoke
        run: bash backend/scripts/ci/native-smoke.sh '${{ matrix.image }}' "$IMAGE"
      - name: Image evidence
        run: echo "Built \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

  python-images:
    name: Python image / ${{ matrix.arch }}
    needs: [prepare, python-tests]
    if: needs.prepare.outputs.python_changed == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ${{ needs.prepare.outputs.registry }}/ircs-adult-classifier-service:${{ needs.prepare.outputs.release_tag }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: published
        run: |
          if bash .github/scripts/image-exists.sh "$IMAGE"; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            result=$?
            test "$result" = 1
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build CPU classifier image
        if: steps.published.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/services/ircs-adult-classifier-service/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE }}
          provenance: false
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: APP_VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=python-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=python-${{ matrix.arch }}

  frontend-tests:
    needs: prepare
    if: needs.prepare.outputs.frontend_tests != '[]'
    name: Frontend ${{ matrix.frontend }} checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.frontend_test_matrix) }}
    defaults:
      run:
        working-directory: frontends/${{ matrix.frontend }}
    env:
      FRONTEND: ${{ matrix.frontend }}
      NEXT_TELEMETRY_DISABLED: '1'
      API_INTERNAL_URL: http://127.0.0.1:9/api/portal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: frontends/${{ matrix.frontend }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test --if-present
      - run: npm run build
        if: contains(fromJSON(needs.prepare.outputs.frontends), matrix.frontend)
      - name: Package compiled frontend
        if: contains(fromJSON(needs.prepare.outputs.frontends), matrix.frontend)
        run: |
          if [[ "$FRONTEND" == admin ]]; then
            tar -czf frontend-dist.tar.gz -C dist .
          else
            mkdir frontend-build
            cp -a .next/standalone/. frontend-build/
            cp -a .next/static frontend-build/.next/static
            cp -a public frontend-build/public
            tar -czf frontend-dist.tar.gz -C frontend-build .
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: contains(fromJSON(needs.prepare.outputs.frontends), matrix.frontend)
        with:
          name: frontend-${{ matrix.frontend }}-${{ github.sha }}
          path: frontends/${{ matrix.frontend }}/frontend-dist.tar.gz
          retention-days: 7

  frontend-images:
    name: Frontend ${{ matrix.frontend }} / ${{ matrix.arch }}
    needs: [prepare, frontend-tests]
    if: needs.prepare.outputs.frontends != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.frontend_matrix) }}
    env:
      IMAGE: ${{ needs.prepare.outputs.registry }}/${{ matrix.image }}:${{ needs.prepare.outputs.release_tag }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: published
        run: |
          if bash .github/scripts/image-exists.sh "$IMAGE"; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            result=$?
            test "$result" = 1
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.published.outputs.exists != 'true'
        with:
          context: frontends/${{ matrix.frontend }}
          file: frontends/${{ matrix.frontend }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE }}
          provenance: false
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            API_INTERNAL_URL=http://127.0.0.1:9/api/portal
            APP_VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=frontend-${{ matrix.frontend }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.frontend }}-${{ matrix.arch }}

  native-consumer-smoke:
    name: Native service runtime / ${{ matrix.arch }}
    needs: [prepare, native-images]
    if: needs.prepare.outputs.images != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Native runtime switches and ingestion round trip
        env:
          REGISTRY: ${{ needs.prepare.outputs.registry }}
          SOURCE_REVISION: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          NATIVE_ARCH: ${{ matrix.arch }}
          JAVA_IMAGES: ${{ needs.prepare.outputs.images }}
          IMAGE_REFS_JSON: ${{ needs.prepare.outputs.image_refs }}
          MODULE_VERSIONS_JSON: ${{ needs.prepare.outputs.module_versions }}
        run: bash backend/scripts/ci/native-consumer-smoke.sh

  manifests:
    needs: [prepare, native-images, native-consumer-smoke, python-images, frontend-images]
    if: >-
      ${{ always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.has_selected == 'true'
          && (needs.prepare.outputs.images == '[]' || (needs.native-images.result == 'success' && needs.native-consumer-smoke.result == 'success'))
          && (needs.prepare.outputs.python_changed != 'true' || needs.python-images.result == 'success')
          && (needs.prepare.outputs.frontends == '[]' || needs.frontend-images.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Assemble verified multiarch images
        env:
          IMAGES: ${{ needs.prepare.outputs.selected_images }}
          REGISTRY: ${{ needs.prepare.outputs.registry }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          python3 - <<'PY' > images.txt
          import json, os
          print('\n'.join(json.loads(os.environ['IMAGES'])))
          PY
          while IFS= read -r image; do
            target="${REGISTRY}/${image}:${RELEASE_TAG}"
            if bash .github/scripts/image-exists.sh "$target"; then
              continue
            else
              result=$?
              test "$result" = 1
            fi
            docker buildx imagetools create --tag "$target" "${target}-amd64" "${target}-arm64"
            echo "- \`$target\` (linux/amd64, linux/arm64)" >> "$GITHUB_STEP_SUMMARY"
          done < images.txt

  gitops:
    name: Promote verified V3 images to GitOps
    needs: [prepare, manifests]
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.has_selected == 'true' && needs.manifests.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update production image references
        env:
          GITOPS_DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          JAVA_IMAGES: ${{ needs.prepare.outputs.images }}
          SELECTED_IMAGES: ${{ needs.prepare.outputs.selected_images }}
          REGISTRY: ${{ needs.prepare.outputs.registry }}
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/ircs-v3-gitops-key"
          hosts_file="${RUNNER_TEMP}/ircs-v3-github-hosts"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          current_head=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')
          if [[ "$current_head" != "$SOURCE_REVISION" ]]; then
            echo 'A newer main revision exists; this older image set will not be deployed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test -n "$GITOPS_DEPLOY_KEY"
          printf '%s\n' "$GITOPS_DEPLOY_KEY" > "$key_file"
          chmod 600 "$key_file"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$hosts_file"
          export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$hosts_file"
          git clone --depth 1 git@github.com:Prodigalgal/k8s-gitops-config.git gitops
          python3 .github/scripts/update-gitops.py gitops
          kubectl kustomize gitops/ircs-prod/core > /dev/null
          kubectl kustomize gitops/ircs-prod/edge-cutover > /dev/null
          git -C gitops add ircs-prod/core
          if git -C gitops diff --cached --quiet; then
            echo 'GitOps already references this revision.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -C gitops -c user.name=ircs-v3-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m "deploy(ircs-v3): ${APP_VERSION} ${SOURCE_REVISION}"
          for attempt in 1 2 3 4; do
            if git -C gitops push origin HEAD:main; then
              echo "Promoted V3 \`${SOURCE_REVISION}\` to production GitOps." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git -C gitops fetch origin main
            git -C gitops rebase origin/main
          done
          echo 'GitOps push did not succeed after four attempts.' >&2
          exit 1
