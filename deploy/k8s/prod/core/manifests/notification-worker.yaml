apiVersion: apps/v1
kind: Deployment
metadata:
  name: ircs-notification-worker
  namespace: ircs-prod
  labels:
    app: ircs-notification-worker
    app.kubernetes.io/part-of: ircs
    environment: prod
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ircs-notification-worker
  template:
    metadata:
      labels:
        app: ircs-notification-worker
        app.kubernetes.io/part-of: ircs
        environment: prod
    spec:
      imagePullSecrets:
        - name: registry-secret
      containers:
        - name: app
          image: registry.mnnu.eu.org/ircs/ircs-notification-worker@sha256:46f41e02c0c76de3e1497ad1c1eaf554f72e0f6a47dfc3a56c798c5e6fc4cf82
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ircs-prod-app-config
          env:
            - name: SPRING_APPLICATION_NAME
              value: ircs-notification-worker
            - name: SPRING_RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: ircs-prod-app-config
                  key: RABBITMQ_HOST
            - name: SPRING_RABBITMQ_USERNAME
              value: admin
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ircs-prod-secrets
                  key: RABBITMQ_PASSWORD
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: ircs-prod-app-config
                  key: DB_URL
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ircs-prod-secrets
                  key: DB_PASSWORD
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "2"
            - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
              value: "0"
            - name: SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT
              value: "30000"
            - name: APP_MAIL_HOST
              valueFrom:
                configMapKeyRef:
                  name: ircs-prod-app-config
                  key: MAIL_HOST
            - name: APP_MAIL_PORT
              valueFrom:
                configMapKeyRef:
                  name: ircs-prod-app-config
                  key: MAIL_PORT
            - name: APP_MAIL_FROM
              valueFrom:
                configMapKeyRef:
                  name: ircs-prod-app-config
                  key: MAIL_FROM
            - name: APP_MAIL_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: ircs-prod-app-config
                  key: APP_MAIL_ENABLED
            - name: APP_MAIL_SEND_HISTORY_CLEANUP_ENABLED
              value: "false"
            - name: APP_MAIL_SEND_HISTORY_CLEANUP_DRY_RUN
              value: "true"
            - name: APP_MAIL_SEND_HISTORY_CLEANUP_EXECUTE_ENABLED
              value: "false"
            - name: APP_MAIL_SEND_HISTORY_CLEANUP_RATE_LIMIT_DELAY_MS
              value: "0"
            - name: APP_NOTIFICATION_CONFIG_LISTENER_ENABLED
              value: "true"
            - name: APP_WORKER_AUDIT_ENABLED
              value: "true"
            - name: APP_WORKER_AUDIT_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: ircs-prod-app-config
                  key: DB_URL
            - name: APP_WORKER_AUDIT_USERNAME
              value: postgres
            - name: APP_WORKER_AUDIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ircs-prod-secrets
                  key: DB_PASSWORD
            - name: APP_WORKER_AUDIT_SOURCE
              value: ircs-notification-worker
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi


