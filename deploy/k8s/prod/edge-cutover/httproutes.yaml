apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: huawai-http-redirect
  namespace: ircs-prod
  labels:
    app.kubernetes.io/part-of: ircs
    environment: prod
spec:
  parentRefs:
    - name: mnnu-gateway
      namespace: gateway-system
      sectionName: http
  hostnames:
    - huawai.mnnu.eu.org
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: huawai-route
  namespace: ircs-prod
  labels:
    app.kubernetes.io/part-of: ircs
    environment: prod
spec:
  parentRefs:
    - name: mnnu-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - huawai.mnnu.eu.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/backend
        - path:
            type: PathPrefix
            value: /api/portal
        - path:
            type: PathPrefix
            value: /media
      backendRefs:
        - name: ircs-portal-bff
          port: 8080
    - backendRefs:
        - name: ircs-portal-frontend
          port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: admin-http-redirect
  namespace: ircs-prod
  labels:
    app.kubernetes.io/part-of: ircs
    environment: prod
spec:
  parentRefs:
    - name: mnnu-gateway
      namespace: gateway-system
      sectionName: http
  hostnames:
    - admin.mnnu.eu.org
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: admin-route
  namespace: ircs-prod
  labels:
    app.kubernetes.io/part-of: ircs
    environment: prod
spec:
  parentRefs:
    - name: mnnu-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - admin.mnnu.eu.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
        - path:
            type: PathPrefix
            value: /media
      backendRefs:
        - name: ircs-admin-bff
          port: 8080
    - backendRefs:
        - name: ircs-admin-frontend
          port: 80
