name: build-and-push

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  backend-images:
    runs-on: ubuntu-latest
    env:
      REGISTRY: harbor.mnnu.eu.org/ircs
      TARGET_ARCH: arm64
      TARGET_OS: linux
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build and push images
        shell: bash
        run: |
          chmod +x scripts/ci/jib-build-push-all.sh
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            export IMAGE_TAG="${GITHUB_REF_NAME}"
          else
            export IMAGE_TAG="sha-$(git rev-parse --short=12 HEAD)"
          fi
          scripts/ci/jib-build-push-all.sh

      - name: Upload image manifest
        uses: actions/upload-artifact@v4
        with:
          name: build-image-manifest
          path: build-image-manifest.txt

