name: build-and-push

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
    paths:
      - ".gitea/workflows/build-and-push.yml"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
      - "platform/**"
      - "services/**"
      - "shared/**"
      - "scripts/ci/**"
  workflow_dispatch:
    inputs:
      build_scope:
        description: "affected, all, or comma-separated service image names"
        required: false
        default: "affected"

jobs:
  backend-images:
    runs-on: ircs
    env:
      REGISTRY: harbor.mnnu.eu.org/ircs
      TARGET_ARCH: arm64
      TARGET_OS: linux
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build and push images
        shell: bash
        run: |
          chmod +x gradlew
          chmod +x scripts/ci/jib-build-push-all.sh
          REF_TYPE="${GITHUB_REF_TYPE:-${GITEA_REF_TYPE:-}}"
          REF_NAME="${GITHUB_REF_NAME:-${GITEA_REF_NAME:-}}"
          if [[ "${REF_TYPE}" == "tag" ]]; then
            export IMAGE_TAG="${REF_NAME}"
          else
            export IMAGE_TAG="sha-$(git rev-parse --short=12 HEAD)"
          fi
          export BUILD_SCOPE="${{ inputs.build_scope || 'affected' }}"
          scripts/ci/jib-build-push-affected.sh

      - name: Print image manifest
        shell: bash
        run: cat build-image-manifest.txt
