plugins {
    id 'org.springframework.boot'
    id 'com.google.cloud.tools.jib'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    implementation 'org.liquibase:liquibase-core'

    runtimeOnly 'org.postgresql:postgresql'
}

springBoot {
    mainClass = 'com.prodigalgal.ircs.migrator.IrcsMigratorApplication'
}

bootJar {
    mainClass = 'com.prodigalgal.ircs.migrator.IrcsMigratorApplication'
}

def parseJibPlatforms() {
    def configured = providers.gradleProperty('jibTargetPlatforms')
            .orElse(providers.gradleProperty('jibTargetOs')
                    .zip(providers.gradleProperty('jibTargetArch')) { os, arch -> "${os}/${arch}" })
            .orElse('linux/arm64')
            .get()
    configured.split(',')
            .collect { it.trim() }
            .findAll { !it.isBlank() }
            .collect { platform ->
                def parts = platform.split('/')
                if (parts.length != 2 || parts[0].isBlank() || parts[1].isBlank()) {
                    throw new GradleException("Invalid jibTargetPlatforms entry '${platform}', expected os/architecture")
                }
                [os: parts[0], architecture: parts[1]]
            }
}

jib {
    containerizingMode = 'packaged'
    from {
        image = providers.gradleProperty('jibBaseImage')
                .orElse('registry.mnnu.eu.org/ircs/base/eclipse-temurin:25-jre-alpine')
                .get()
        platforms {
            parseJibPlatforms().each { targetPlatform ->
                platform {
                    architecture = targetPlatform.architecture
                    os = targetPlatform.os
                }
            }
        }
    }
    to {
        image = providers.gradleProperty('jibToImage')
                .orElse('harbor.mnnu.eu.org/ircs/ircs-migrator:dev')
                .get()
    }
    container {
        creationTime = 'USE_CURRENT_TIMESTAMP'
    }
}
