spring:
  main:
    keep-alive: true
  application:
    name: ircs-content-safety-service
  threads:
    virtual:
      enabled: true
  jackson:
    use-jackson2-defaults: true

server:
  port: ${SERVER_PORT:8080}

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_ENDPOINT:http://localhost:4318/v1/traces}
          transport: http
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  content-safety:
    internal-access:
      require-token: ${APP_CONTENT_SAFETY_INTERNAL_ACCESS_REQUIRE_TOKEN:false}
      token: ${APP_CONTENT_SAFETY_INTERNAL_ACCESS_TOKEN:}
      required-scope: ${APP_CONTENT_SAFETY_INTERNAL_ACCESS_REQUIRED_SCOPE:content-safety:assess}
    adult:
      max-text-length: ${APP_CONTENT_SAFETY_ADULT_MAX_TEXT_LENGTH:512}
      model:
        enabled: ${APP_CONTENT_SAFETY_ADULT_MODEL_ENABLED:false}
        provider: ${APP_CONTENT_SAFETY_ADULT_MODEL_PROVIDER:PYTHON}
        name: ${APP_CONTENT_SAFETY_ADULT_MODEL_NAME:uget/sexual_content_dection}
        version: ${APP_CONTENT_SAFETY_ADULT_MODEL_VERSION:remote}
        endpoint: ${APP_CONTENT_SAFETY_ADULT_MODEL_ENDPOINT:}
        service-id: ${APP_CONTENT_SAFETY_ADULT_MODEL_SERVICE_ID:${spring.application.name}}
        service-token: ${APP_CONTENT_SAFETY_ADULT_MODEL_SERVICE_TOKEN:${APP_ADULT_CLASSIFIER_SERVICE_TOKEN:}}
        scopes: ${APP_CONTENT_SAFETY_ADULT_MODEL_SCOPES:adult-classifier:classify}
        request-timeout: ${APP_CONTENT_SAFETY_ADULT_MODEL_REQUEST_TIMEOUT:PT3S}
        adult-threshold: ${APP_CONTENT_SAFETY_ADULT_MODEL_ADULT_THRESHOLD:0.85}
        suspect-threshold: ${APP_CONTENT_SAFETY_ADULT_MODEL_SUSPECT_THRESHOLD:0.5}
    google-decision:
      credential-service-base-url: ${APP_CONTENT_SAFETY_GOOGLE_DECISION_CREDENTIAL_SERVICE_BASE_URL:http://ircs-credential-service:8080}
      credential-service-token: ${APP_CONTENT_SAFETY_GOOGLE_DECISION_CREDENTIAL_SERVICE_TOKEN:}
      credential-service-id: ${APP_CONTENT_SAFETY_GOOGLE_DECISION_CREDENTIAL_SERVICE_ID:ircs-content-safety-service}
      credential-service-scopes: ${APP_CONTENT_SAFETY_GOOGLE_DECISION_CREDENTIAL_SERVICE_SCOPES:credential:lease}
      request-timeout: ${APP_CONTENT_SAFETY_GOOGLE_DECISION_REQUEST_TIMEOUT:PT10S}
      batch-size: ${APP_CONTENT_SAFETY_GOOGLE_DECISION_BATCH_SIZE:20}
      max-request-budget: ${APP_CONTENT_SAFETY_GOOGLE_DECISION_MAX_REQUEST_BUDGET:24000}
      max-text-length: ${APP_CONTENT_SAFETY_GOOGLE_DECISION_MAX_TEXT_LENGTH:12000}
      max-batch-wait: ${APP_CONTENT_SAFETY_GOOGLE_DECISION_MAX_BATCH_WAIT:PT0.5S}
      queue-capacity: ${APP_CONTENT_SAFETY_GOOGLE_DECISION_QUEUE_CAPACITY:10000}
      queue-ttl: ${APP_CONTENT_SAFETY_GOOGLE_DECISION_QUEUE_TTL:PT24H}
      result-ttl: ${APP_CONTENT_SAFETY_GOOGLE_DECISION_RESULT_TTL:PT24H}
      concurrent-batches: ${APP_CONTENT_SAFETY_GOOGLE_DECISION_CONCURRENT_BATCHES:2}
      min-confidence: ${APP_CONTENT_SAFETY_GOOGLE_DECISION_MIN_CONFIDENCE:0.9}
